<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, follow" />
    <title>页面未找到 - Aixuno Scan</title>
    <meta name="theme-color" content="#070b16" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%232563eb'/%3E%3Cpath fill='%23fff' d='M17 5H7a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2Zm0 12H7l2.5-3 2 2.5 2.5-3 3.5 3.5Zm-6.4-4.8a1.4 1.4 0 1 0 0-2.8 1.4 1.4 0 0 0 0 2.8Z'/%3E%3C/svg%3E" />
    <style>
      :root {
        --bg: #ffffff;
        --bg-soft: #f6f8fb;
        --card: #ffffff;
        --ink: #101522;
        --ink-soft: #5b6472;
        --line: #e6eaf1;
        --accent: #2f6bff;
        --accent-2: #8b5cf6;
        --accent-ink: #ffffff;
        --accent-soft: #eef3ff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #070b16;
          --bg-soft: #0d1424;
          --card: #101a2e;
          --ink: #e8ecf5;
          --ink-soft: #9aa6bd;
          --line: #1e2a42;
          --accent: #6b93ff;
          --accent-2: #a78bfa;
          --accent-soft: #14203a;
        }
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px 20px;
        background: var(--bg);
        color: var(--ink);
        font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
        line-height: 1.65;
        -webkit-font-smoothing: antialiased;
      }
      .wrap { width: 100%; max-width: 560px; text-align: center; }
      .code {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 14px;
        border-radius: 999px;
        background: var(--accent-soft);
        color: var(--accent);
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.04em;
        margin-bottom: 22px;
      }
      h1 {
        margin: 0 0 6px;
        font-size: clamp(26px, 6vw, 34px);
        line-height: 1.3;
        letter-spacing: -0.01em;
      }
      .en {
        margin: 0 0 20px;
        font-size: 15px;
        color: var(--ink-soft);
        font-weight: 500;
      }
      p { margin: 0 0 12px; color: var(--ink-soft); font-size: 15px; }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        justify-content: center;
        margin: 26px 0 0;
      }
      a.btn {
        display: inline-block;
        padding: 11px 22px;
        border-radius: 12px;
        font-size: 15px;
        font-weight: 600;
        text-decoration: none;
        transition: transform 0.15s ease, opacity 0.15s ease;
      }
      a.btn:hover { transform: translateY(-1px); }
      a.primary {
        background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
        color: var(--accent-ink);
      }
      a.secondary { border: 1px solid var(--line); background: var(--bg-soft); color: var(--ink); }
      .divider { height: 1px; background: var(--line); margin: 26px 0 20px; }
      .small { font-size: 13px; color: var(--ink-soft); }
      .small a { color: var(--accent); }
      :focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main class="wrap">
      <span class="code">404</span>
      <h1>页面未找到</h1>
      <p class="en" lang="en">Page not found</p>
      <p>你访问的页面可能已移动、重命名或从未存在。</p>
      <p lang="en">The page you are looking for may have been moved, renamed, or never existed.</p>
      <div class="actions">
        <a class="btn primary" href="/">返回首页</a>
        <a class="btn secondary" href="/zh/" lang="en">中文首页</a>
      </div>
      <div class="divider"></div>
      <p class="small">
        Aixuno Scan — 免费在线文档扫描、OCR 与 PDF 工具 ·
        <a href="/about.html">关于本站</a>
      </p>
    </main>
  </body>
</html>
